overview:
  bioHtml: |
    Hi! I'm an incoming PhD student at Harvard University, advised by <a href="https://sites.google.com/site/sueyeonchung/." target="_blank" rel="noreferrer">Prof. Sueyeon Chung</a>. I'm interested in understanding model representations through mechanistic intepretability, and building brain-inspired models that learn and generalize in more human-like ways.
    <br /><br />
    I am currently at <a href="https://www.brown.edu/" target="_blank" rel="noreferrer"><img src="{{brownLogoText}}" alt="Brown" class="school-logo" /></a>pursuing my Sc.M. in Computer Science, working with <a href="https://vivo.brown.edu/display/tserre" target="_blank" rel="noreferrer">Prof. Thomas Serre</a>.
    Previously, I did my undergraduate studies at <a href="https://www.wisc.edu/" target="_blank" rel="noreferrer"><img src="{{wiscLogo}}" alt="UW-Madison" class="school-logo" /></a>with a triple major in Computer Sciences, Mathematics, and Data Science, where I worked with <a href="https://www.biostat.wisc.edu/~vsingh/" target="_blank" rel="noreferrer">Prof. Vikas Singh</a> and <a href="https://psych.wisc.edu/staff/rogers-timothy-t/" target="_blank" rel="noreferrer">Prof. Timothy T. Rogers</a>.
